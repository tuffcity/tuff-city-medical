name = "tuff-city-medical"
main = "src/entry.js"
compatibility_date = "2025-06-01"

# No workers.dev routes — the only public entry is the Access-gated custom domain.
# TOML gotcha: these keys (and `routes`, `vars`) are TOP-LEVEL and MUST come before any
# [table] or [[array-of-tables]] header, or they silently become part of that table.
workers_dev = false
preview_urls = false

routes = [
  { pattern = "med.tuffcityrecords.com", custom_domain = true }
]

[vars]
# Defence in depth behind the Access policy: only these emails reach /api/*.
ALLOWED_EMAILS = "nanci@tuffcity.com, aaronf@tuffcity.com"

[[kv_namespaces]]
binding = "RECORDS"
# tuff-city-medical-RECORDS (created 2026-10-06)
id = "ad60b36992244b3ca5371cc0650241da"

# Page files are bundled into the script (see src/entry.js) — no Workers Assets upload.
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.svg", "**/*.json.txt"]
fallthrough = true
